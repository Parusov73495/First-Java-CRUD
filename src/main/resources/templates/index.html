
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f4f6f9; }
        h1 { color: #243b53; }
        form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ccd; border-radius: 5px; }
        button { padding: 10px 14px; border: 0; border-radius: 5px; background: #2463eb; color: white; cursor: pointer; }
        .delete { background: #d33; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: #243b53; color: white; }
    </style>
</head>
<body>
<h1>Student Management System</h1>
<p>Add, view, update and delete student records.</p>

<h2>Add student</h2>
<form action="/add" method="post">
    <input name="name" placeholder="Student name" required>
    <input name="email" type="email" placeholder="Email address" required>
    <button type="submit">Add student</button>
</form>

<h2>Students</h2>
<table>
    <thead>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Update</th><th>Delete</th></tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.email}"></td>
        <td>
            <form th:action="@{/update/{id}(id=${s.id})}" method="post">
                <input name="name" th:value="${s.name}" required>
                <input name="email" type="email" th:value="${s.email}" required>
                <button type="submit">Save</button>
            </form>
        </td>
        <td>
            <form th:action="@{/delete/{id}(id=${s.id})}" method="post">
                <button class="delete" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
